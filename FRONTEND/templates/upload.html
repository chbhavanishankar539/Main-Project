<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Index</title>
    <meta content="" name="description" />
    <meta content="" name="keywords" />

    <!-- Favicons -->
    <link href="/static/assets/img/favicon.png" rel="icon" />
    <link href="/static/assets/img/apple-touch-icon.png" rel="apple-touch-icon" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet" />

    <!-- Vendor CSS Files -->
    <link href="/static/assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="/static/assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet" />
    <link href="/static/assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet" />
    <link href="/static/assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />

    <!-- Template Main CSS File -->
    <link href="/static/assets/css/style.css" rel="stylesheet" />

  </head>

  <body>
    <!-- ======= Header ======= -->
    <header id="header" class="fixed-top header-transparent">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="logo">
          <h1><a href="#">Signature Recognition</a></h1>
        </div>

        <nav id="navbar" class="navbar">
          <ul>
            <li><a class="nav-link scrollto active" href="/">Logout</a></li>
            <!-- <li><a class="nav-link scrollto" href="/live_prediction">Stress Detection</a></li> -->
          </ul>
          <i class="bi bi-list mobile-nav-toggle"></i>
        </nav>
      </div>
    </header>
    <!-- End Header -->

    <!-- ======= Hero Section ======= -->
    <section id="hero" class="d-flex align-items-center">
      <div class="container" data-aos="fade-up">
        <div class="section-title">
          <h2 style="font-size:xx-large"><b>Upload an Image</b></h2>
        </div>

        <div class="row">
          <div class="col-lg-6">
            <!-- Upload Form -->
            <form action="/upload" method="POST" enctype="multipart/form-data">
              <div class="form-group">
                <label for="file">Choose an image to upload:</label>
                <input type="file" class="form-control" id="file" name="file" accept="image/*" required />
              </div>
              <button type="submit" class="btn btn-primary mt-3">Upload and Predict</button>
            </form>
          </div>

          <div class="col-lg-6">
            <!-- Display the uploaded image -->
            {% if path %}
              <img src="{{ path }}" style="width:300px; height:250px;" alt="Uploaded Image"><br>
              <!-- Display the prediction -->
              <b style="color:green">{{ prediction }}</b>
              {% if prediction == "Stress" %}
                <button onclick="openPDF()" class="btn btn-success">View Precautions</button>
                <script src="script.js"></script>
              {% endif %}
            {% endif %}
          </div>
        </div>
      </div>
    </section>
    <!-- End Hero -->

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center">
      <i class="bi bi-arrow-up-short"></i>
    </a>

    <!-- Vendor JS Files -->
    <script src="/static/assets/vendor/aos/aos.js"></script>
    <script src="/static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/vendor/glightbox/js/glightbox.min.js"></script>
    <script src="/static/assets/vendor/swiper/swiper-bundle.min.js"></script>
    <script src="/static/assets/vendor/php-email-form/validate.js"></script>
    <script src="/static/assets/js/main.js"></script>
  </body>
</html>
